<!DOCTYPE html>
<!--
  Kelpie start page.

  First-party content served from the `kelpie://` scheme by
  `src/start_page_scheme.cpp`. It mirrors the macOS `StartPageView`: a small app
  icon, a "Favourites" grid of site cards, a "Recent" grid of the most recently
  visited sites that are not already favourites, and the "Open a website to get
  started" empty state.

  Each card is a screenshot of the site with its favicon in the corner and the
  domain underneath. A site Kelpie has not captured yet shows a coloured tile
  with its favicon or initial instead.

  Bookmarks and history arrive from `data.json` on this same scheme and origin,
  and screenshots from `preview/<id>.jpg`, so the page never injects a script
  into third-party content and never needs a native bridge.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src kelpie: data:; style-src kelpie:; script-src kelpie:; connect-src kelpie:"
    />
    <title>Kelpie</title>
    <link rel="stylesheet" href="start.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <main class="page">
      <header class="brand">
        <img class="app-icon" src="app-icon.png" alt="Kelpie" />
      </header>

      <section class="section" id="favourites-section" aria-labelledby="favourites-title" hidden>
        <h2 class="section-title" id="favourites-title">Favourites</h2>
        <div class="site-grid" id="favourites-grid"></div>
      </section>

      <section class="section" id="recent-section" aria-labelledby="recent-title" hidden>
        <h2 class="section-title" id="recent-title">Recent</h2>
        <div class="site-grid site-grid-compact" id="recent-grid"></div>
      </section>

      <p class="empty-state" id="empty-state" hidden>Open a website to get started</p>
    </main>
    <script src="start.js"></script>
  </body>
</html>
