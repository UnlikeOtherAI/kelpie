name: Native browser contract toolchain
description: Install the explicit Node/pnpm prerequisites for native generated contracts
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.0.8
      with:
        version: 10
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: 20
        cache: pnpm
