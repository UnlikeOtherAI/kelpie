name: Recover release publication

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Completed Publish Release Assets run whose verified artifacts should be attached
        required: true
        type: string
  workflow_run:
    workflows: [Publish Release Assets]
    types: [completed]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: recover-release-${{ github.event.workflow_run.id || inputs.artifact_run_id }}
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.source.outputs.linux }}
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_RUN_ID: ${{ github.event.workflow_run.id || inputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Validate completed builds against the published tag
        id: source
        run: node scripts/prepare-release-recovery.mjs "$ARTIFACT_RUN_ID"
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          path: dist/release
      - name: Give checksum assets unique component names
        run: |
          find dist/release -name checksums.txt -print0 | while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            mv "$file" "$directory/checksums-$(basename "$directory").txt"
          done
      - name: Attach and verify completed assets
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: node scripts/attach-release-assets.mjs "$RELEASE_TAG" dist/release
      - name: Advertise completed app updates
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: node scripts/publish-built-app-updates.mjs "$RELEASE_TAG"

  publish-package-repos:
    needs: recover
    if: ${{ needs.recover.outputs.linux == 'true' }}
    uses: ./.github/workflows/publish-linux-repositories.yml
    secrets: inherit
