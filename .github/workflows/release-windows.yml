name: Build Unsigned Windows Candidate

on:
  workflow_dispatch:
  release:
    types: [published]

# CI may retain candidates, but cannot publish an unsigned Windows release.
permissions:
  contents: read

concurrency:
  group: windows-unsigned-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.release.body, '<!-- kelpie-release-components:') || contains(github.event.release.body, '<!-- kelpie-release-component: windows -->') }}"
    name: Build unsigned Windows candidate
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/browser-contract
      - name: Verify harness and release policy
        shell: pwsh
        run: node --test tests/windows/process.test.mjs tests/windows/release-policy.test.mjs
      - name: Build and package unsigned candidate
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-candidate-${{ github.sha }}
          path: |
            dist/release/windows/*-unsigned.zip
            dist/release/windows/*-unsigned.zip.sha256
            dist/release/windows/*-unsigned.zip.provenance.txt
          if-no-files-found: error
