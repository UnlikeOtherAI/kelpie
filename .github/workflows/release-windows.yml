name: Publish Windows Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: "${{ !startsWith(github.event.release.body, '<!-- kelpie-release-components: macos -->') }}"
    name: Build Windows release artifact
    runs-on: windows-2022
    # The same build and package as the Windows CEF job: ~9.5 minutes green.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/browser-contract
      - name: Verify harness process handling
        shell: pwsh
        run: node --test tests/windows/process.test.mjs
      - name: Build and package Windows release
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            dist/release/windows/*.zip
            dist/release/windows/*.sha256
            dist/release/windows/*.provenance.txt
          if-no-files-found: error

  attach-windows-to-release:
    name: Attach Windows assets to GitHub release
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-release
          path: dist/release/windows
      - uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/release/windows/*.zip
            dist/release/windows/*.sha256
            dist/release/windows/*.provenance.txt

