name: Build Windows Release Candidate

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: "${{ !startsWith(github.event.release.body, '<!-- kelpie-release-components:') || contains(github.event.release.body, '<!-- kelpie-release-component: windows -->') }}"
    name: Build unsigned Windows candidate
    runs-on: windows-2022
    # The same build and package as the Windows CEF job: ~9.5 minutes green.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/browser-contract
      - name: Verify harness process handling
        shell: pwsh
        run: node --test tests/windows/process.test.mjs
      - name: Build and package Windows release
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release-candidate
          path: |
            dist/release/windows/*.zip
            dist/release/windows/*.sha256
            dist/release/windows/*.provenance.txt
          if-no-files-found: error
