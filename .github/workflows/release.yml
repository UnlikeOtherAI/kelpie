name: Publish Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-linux:
    if: "${{ !startsWith(github.event.release.body, '<!-- kelpie-release-components:') || contains(github.event.release.body, '<!-- kelpie-release-component: linux -->') }}"
    uses: ./.github/workflows/linux-native.yml
    with:
      force_build: true
      release_tag: ${{ github.event.release.tag_name }}
      artifact_prefix: linux-release

  build-android:
    if: "${{ !startsWith(github.event.release.body, '<!-- kelpie-release-components:') || contains(github.event.release.body, '<!-- kelpie-release-component: android -->') }}"
    name: Build Android release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Require Android release signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              printf '::error::Missing Android release signing configuration: %s\n' "$name"
              exit 1
            fi
          done
      - uses: ./.github/actions/browser-contract

      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4.0.3

      - name: Build Android APK and App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd apps/android

          umask 077
          signing_keystore="${RUNNER_TEMP}/kelpie-android-signing.jks"
          trap 'rm -f "$signing_keystore"' EXIT
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$signing_keystore"
          SIGNING_ARGS=(
            "-Pandroid.injected.signing.store.file=${signing_keystore}"
            "-Pandroid.injected.signing.store.password=${ANDROID_KEYSTORE_PASSWORD}"
            "-Pandroid.injected.signing.key.alias=${ANDROID_KEY_ALIAS}"
            "-Pandroid.injected.signing.key.password=${ANDROID_KEY_PASSWORD}"
          )

          ./gradlew assembleRelease bundleRelease "${SIGNING_ARGS[@]}"

          apk="app/build/outputs/apk/release/app-release.apk"
          bundle="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$bundle"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify "$apk"
          jarsigner -J-Duser.language=en -J-Duser.country=US -verify "$bundle" > "${RUNNER_TEMP}/kelpie-android-bundle-verification.txt"
          if ! grep -Fxq 'jar verified.' "${RUNNER_TEMP}/kelpie-android-bundle-verification.txt"; then
            printf '::error::Android App Bundle has no verified signing identity\n'
            exit 1
          fi

          release_label="$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's#[^0-9A-Za-z._-]+#-#g')"
          out_dir="../../dist/release/android"
          mkdir -p "${out_dir}"

          cp "$apk" "${out_dir}/kelpie-android-${release_label}-release.apk"
          cp "$bundle" "${out_dir}/kelpie-android-${release_label}-release.aab"

          (
            cd "${out_dir}"
            sha256sum ./*.apk ./*.aab > checksums.txt
          )

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android-release
          path: |
            dist/release/android/*.apk
            dist/release/android/*.aab
            dist/release/android/checksums.txt
          if-no-files-found: error

  publish-cli:
    if: "${{ !startsWith(github.event.release.body, '<!-- kelpie-release-components:') || contains(github.event.release.body, '<!-- kelpie-release-component: cli -->') }}"
    name: Build and publish CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CLI release tag
        run: |
          set -euo pipefail
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          case "${GITHUB_REF_NAME}" in
            v*)
              release_version="${GITHUB_REF_NAME#v}"
              if [ "${cli_version}" != "${release_version}" ]; then
                echo "Release tag ${release_version} does not match CLI version ${cli_version}" >&2
                exit 1
              fi
              ;;
            release/*)
              echo "Date-tagged release ${GITHUB_REF_NAME}; publishing CLI package version ${cli_version}"
              ;;
            *)
              echo "Unsupported release tag ${GITHUB_REF_NAME}; expected v<version> or release/<date>" >&2
              exit 1
              ;;
          esac

      - name: Build and test CLI packages
        run: |
          pnpm --filter @unlikeotherai/kelpie-shared build
          pnpm --filter @unlikeotherai/kelpie build
          pnpm --filter @unlikeotherai/kelpie-shared test
          pnpm --filter @unlikeotherai/kelpie test

      - name: Pack CLI tarballs
        run: |
          set -euo pipefail
          mkdir -p dist/release/cli
          pnpm --filter @unlikeotherai/kelpie-shared pack --pack-destination dist/release/cli
          pnpm --filter @unlikeotherai/kelpie pack --pack-destination dist/release/cli
          (
            cd dist/release/cli
            sha256sum ./*.tgz > checksums.txt
          )

      - name: Publish shared package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/shared/package.json').version")"
          if npm view "@unlikeotherai/kelpie-shared@${version}" version >/dev/null 2>&1; then
            echo "@unlikeotherai/kelpie-shared@${version} already published"
          elif [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is required to publish @unlikeotherai/kelpie-shared@${version}" >&2
            exit 1
          else
            cd packages/shared && npm publish --access public --provenance
          fi

      - name: Publish CLI package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "@unlikeotherai/kelpie@${version}" version >/dev/null 2>&1; then
            echo "@unlikeotherai/kelpie@${version} already published"
          elif [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is required to publish @unlikeotherai/kelpie@${version}" >&2
            exit 1
          else
            cd packages/cli && npm publish --access public --provenance
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-release
          path: |
            dist/release/cli/*.tgz
            dist/release/cli/checksums.txt
          if-no-files-found: error

  # Selected releases start with a components header and list one component
  # marker per enabled job. Unmarked releases retain the full release workflow.
  attach-to-release:
    if: ${{ !failure() && !cancelled() && contains(needs.*.result, 'success') }}
    name: Attach assets to GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-android
      - publish-cli
    steps:
      - uses: actions/download-artifact@v8.0.1
        if: needs.build-linux.result == 'success'
        with:
          pattern: 'linux-release-*'
          merge-multiple: false
          path: dist/release

      - uses: actions/download-artifact@v8.0.1
        if: needs.build-android.result == 'success'
        with:
          name: android-release
          path: dist/release/android

      - uses: actions/download-artifact@v8.0.1
        if: needs.publish-cli.result == 'success'
        with:
          name: cli-release
          path: dist/release/cli

      - name: Give checksum assets unique component names
        run: |
          find dist/release -name checksums.txt -print0 | while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            mv "$file" "$directory/checksums-$(basename "$directory").txt"
          done

      - uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/release/**/*.tar.gz
            dist/release/**/*.deb
            dist/release/**/*.rpm
            dist/release/**/*.AppImage
            dist/release/**/*.apk
            dist/release/**/*.aab
            dist/release/**/*.tgz
            dist/release/**/checksums-*.txt

  publish-package-repos:
    # Skipped, unchanged components must not suppress a successful Linux release.
    if: "${{ !cancelled() && needs.attach-to-release.result == 'success' && (!startsWith(github.event.release.body, '<!-- kelpie-release-components:') || contains(github.event.release.body, '<!-- kelpie-release-component: linux -->')) }}"
    name: Publish Linux package repositories
    runs-on: ubuntu-latest
    needs:
      - attach-to-release
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install package repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${APT_GPG_PRIVATE_KEY}" ]; then
            exit 0
          fi
          printf '%s' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Build package repositories in site/
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: bash scripts/build-linux-package-repos.sh --site-dir site

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - uses: actions/deploy-pages@v5.0.0
