name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      linux_native_candidate:
        description: Build Linux ABI/package candidates for affected native source (no publication)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-native-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_native_candidate
    uses: ./.github/workflows/linux-native.yml
    permissions:
      contents: read
    with:
      force_build: true
      release_tag: ''
      artifact_prefix: linux-native-candidate

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint
