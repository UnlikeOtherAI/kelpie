name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      linux_fedora_cli_diagnostic:
        description: Run exact prior Fedora RPM installed CLI-only diagnostic
        type: boolean
        default: false
      linux_native_candidate:
        description: Build Linux ABI/package candidates for affected native source (no publication)
        type: boolean
        default: false
      linux_mux_probe:
        description: Compare the retained Ubuntu AVC fixture through bounded mux modes
        type: boolean
        default: false
      linux_resource_source_run:
        description: Prior Linux candidate run ID for numeric resource diagnosis
        type: string
        default: ""

permissions:
  contents: read

jobs:
  linux-fedora-cli-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_fedora_cli_diagnostic
    uses: ./.github/workflows/linux-installed-cli-diagnostic.yml
    permissions:
      contents: read
      actions: read

  linux-mux-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_mux_probe
    uses: ./.github/workflows/linux-mux-probe.yml
    permissions:
      contents: read
      actions: read

  linux-resource-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_resource_source_run != ''
    uses: ./.github/workflows/linux-resource-diagnostic.yml
    permissions:
      contents: read
      actions: read
    with:
      source_run: ${{ inputs.linux_resource_source_run }}

  linux-native-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_native_candidate
    uses: ./.github/workflows/linux-native.yml
    permissions:
      contents: read
    with:
      force_build: true
      release_tag: ''
      artifact_prefix: linux-native-candidate

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint
