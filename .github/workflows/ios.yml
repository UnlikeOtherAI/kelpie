name: iOS

on:
  pull_request:
    paths: &ios_build_inputs
      - 'apps/ios/**'
      # Cross-project source globs linked by apps/ios/Project.swift.
      - 'apps/macos/Kelpie/AI/OpenAICompatible/**/*.swift'
      - 'apps/macos/Kelpie/Account/AccountBookmarks.swift'
      - 'apps/macos/Kelpie/Account/UOAAccount.swift'
      - 'apps/macos/Kelpie/Account/UOAAuthorization.swift'
      - 'apps/macos/Kelpie/Account/UOALoginWebView.swift'
      - 'apps/macos/Kelpie/Account/UOAPresentation.swift'
      - 'apps/macos/Kelpie/Account/UOASession.swift'
      - 'apps/macos/Kelpie/Account/UOASettingsStream.swift'
      - 'apps/macos/Kelpie/Account/UOATransport.swift'
      - 'apps/macos/Kelpie/Browser/AddressInput.swift'
      - 'apps/macos/Kelpie/Browser/BookmarkNode.swift'
      - 'apps/macos/Kelpie/Browser/BookmarkStore.swift'
      - 'apps/macos/Kelpie/Browser/BookmarkTree.swift'
      - 'apps/macos/Kelpie/Browser/NetworkTrafficPersistence.swift'
      - 'apps/macos/Kelpie/Browser/PartitionMap.swift'
      - 'apps/macos/Kelpie/Browser/PartitionValidator.swift'
      - 'apps/macos/Kelpie/Connect/**/*.swift'
      - 'apps/macos/Kelpie/Handlers/ScriptArtifactStore.swift'
      - 'apps/macos/Kelpie/Handlers/ScriptCaptureBudget.swift'
      - 'apps/macos/Kelpie/Handlers/ScriptCaptureError.swift'
      - 'apps/macos/Kelpie/Handlers/ScriptGIFEncoder.swift'
      - 'apps/macos/Kelpie/Handlers/ScriptImageEncoder.swift'
      - 'apps/macos/Kelpie/Handlers/ScriptOutputRedaction.swift'
      - 'apps/macos/Kelpie/Handlers/ScriptOverlayDrawing.swift'
      - 'apps/macos/Kelpie/Handlers/ScriptVideoSegmentSink.swift'
      - 'apps/macos/Kelpie/Handlers/ScriptVideoWriter.swift'
      - 'apps/macos/Kelpie/Handlers/Snapshot3DBridge.swift'
      - 'apps/macos/Kelpie/Network/AccountPairingAuthorization.swift'
      - 'apps/macos/Kelpie/Network/BrowserControlGateway.swift'
      - 'apps/macos/Kelpie/Network/Router\+BrowserControl.swift'
      - 'apps/macos/Kelpie/Network/ScriptGatewayPolicy.swift'
      - 'apps/macos/Kelpie/Storage/SecretStore.swift'
      - 'apps/macos/Kelpie/Views/BrowserChromeAppearance.swift'
      - 'apps/macos/Kelpie/Views/BrowserChromeSampler.swift'
      - 'native/**'
      - 'packages/shared/**'
      - 'scripts/native/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/actions/browser-contract/**'
      - '.github/workflows/ios.yml'
      - '.mise.toml'
      - '.swiftlint.yml'
      - 'Makefile'
  push:
    branches:
      - main
    paths: *ios_build_inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS (simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Check shared Swift source path filters
        run: |
          ruby -ryaml - <<'RUBY'
          workflow = YAML.safe_load(File.read('.github/workflows/ios.yml', encoding: 'UTF-8'), aliases: true)
          events = workflow.fetch('on') { workflow.fetch(true) }
          manifest = File.read('apps/ios/Project.swift', encoding: 'UTF-8')
          # This job builds the application target. Unit-test-only Mac sources do not affect that product.
          app = manifest.split('let kelpieTests = Target.target(', 2).first
          inputs = app.scan(/\.glob\((?:pattern:\s*)?"\.\.\/macos\/([^"]+)"/).flatten
          expected = inputs.map { |path| 'apps/macos/' + path.gsub('+') { '\+' } }.sort
          abort 'No shared Swift sources found in the iOS project' if expected.empty?
          %w[pull_request push].each do |event|
            paths = events.fetch(event).fetch('paths')
            abort "iOS #{event} must trigger on its workflow changes" unless paths.include?('.github/workflows/ios.yml')
            actual = paths.select { |path| path.start_with?('apps/macos/') }.sort
            abort "iOS #{event} filters differ from Project.swift: #{(expected - actual) + (actual - expected)}" unless expected == actual
          end
          RUBY
      - uses: ./.github/actions/browser-contract

      - name: Install mise (tuist)
        uses: jdx/mise-action@v4.1.0

      - name: Vendor AppReveal (required by Project.swift)
        run: |
          set -euo pipefail
          mkdir -p vendor
          if [ ! -d vendor/AppReveal ]; then
            git clone --depth 1 https://github.com/UnlikeOtherAI/AppReveal.git vendor/AppReveal
          fi

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Symlink SwiftLint to /opt/homebrew/bin
        # Makefile invokes /opt/homebrew/bin/swiftlint directly.
        # On GitHub-hosted runners brew sometimes lives at /usr/local; bridge it.
        run: |
          set -euo pipefail
          mkdir -p /opt/homebrew/bin
          if [ ! -x /opt/homebrew/bin/swiftlint ]; then
            ln -sfn "$(command -v swiftlint)" /opt/homebrew/bin/swiftlint
          fi

      - name: Lint Swift
        run: make lint-swift

      - name: Build native libraries for iOS simulator
        run: |
          set -euo pipefail
          cmake -S native -B native/.build-ios-sim \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DKELPIE_BUILD_DESKTOP_ENGINES=OFF
          cmake --build native/.build-ios-sim --config Debug

      - name: Flatten native build output to expected layout
        # Xcode generator nests outputs under per-config dirs. The iOS
        # Project.swift expects them at native/.build-ios-sim/<lib>/lib*.a.
        run: |
          set -euo pipefail
          for lib in core-state core-connect core-protocol core-automation core-mcp core-ai \
            _deps/kelpie_llama-build/src _deps/kelpie_llama-build/ggml/src _deps/kelpie_llama-build/ggml/src/ggml-cpu; do
            src="native/.build-ios-sim/${lib}/Debug-iphonesimulator"
            dst="native/.build-ios-sim/${lib}"
            if [ -d "${src}" ]; then
              find "${src}" -maxdepth 1 -name 'lib*.a' -exec cp -a {} "${dst}/" \;
            fi
          done

      - name: Generate Xcode project (tuist)
        working-directory: apps/ios
        run: mise exec -- tuist generate --no-open

      - name: Build iOS scheme
        # macos-15 is Apple Silicon — restrict to arm64 to match the prebuilt
        # native .a files (also arm64 only, see CMAKE_OSX_ARCHITECTURES above).
        run: |
          set -euo pipefail
          xcodebuild build \
            -project apps/ios/Kelpie.xcodeproj \
            -scheme Kelpie \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath apps/ios/.build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            VALID_ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""
