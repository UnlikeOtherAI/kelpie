name: Windows CEF
on:
  pull_request:
    paths: [apps/windows/**, native/**, packages/shared/**, pnpm-lock.yaml, scripts/native/**, scripts/*windows.ps1, tests/windows/**, .github/workflows/windows.yml]
  push:
    branches: [main]
    paths: [apps/windows/**, native/**, packages/shared/**, pnpm-lock.yaml, scripts/native/**, scripts/*windows.ps1, tests/windows/**, .github/workflows/windows.yml]
  workflow_dispatch:
    inputs:
      hosted_g08:
        description: Run the owned public CEF capture diagnostic
        type: boolean
        default: false
      hosted_png_ab:
        description: Run the test-only serial PNG speed comparison
        type: boolean
        default: false
permissions: {contents: read}
jobs:
  build:
    runs-on: windows-2022
    # A green run takes ~9.5 minutes (2026-09-23), so 30 leaves ~3x headroom
    # and a stall fails in half an hour instead of GitHub's six.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/browser-contract
      - name: Initialize hosted capture evidence
        if: ${{ inputs.hosted_g08 }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'kelpie-hosted-g08-preflight'
          New-Item -ItemType Directory $dir | Out-Null
          '{"stage":"workflow-started","status":"pending","code":null}' | Set-Content (Join-Path $dir 'preflight.json')
      - name: Verify hosted preflight policy
        if: ${{ inputs.hosted_g08 }}
        shell: pwsh
        run: ./scripts/hosted-windows-build-check.test.ps1
      - name: Verify harness process handling
        shell: pwsh
        run: node --test tests/windows/process.test.mjs
      - name: Build CEF wrapper and Windows release
        shell: pwsh
        run: |
          if ('${{ inputs.hosted_png_ab }}' -eq 'true') {
            if ('${{ inputs.hosted_g08 }}' -ne 'true') { throw 'PNG_AB_REQUIRES_HOSTED_G08' }
            ./scripts/build-windows.ps1 -TestScriptPngSpeed
          } else { ./scripts/build-windows.ps1 }
      - name: Prepare hosted public capture dependencies
        if: ${{ inputs.hosted_g08 }}
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter '@unlikeotherai/kelpie-shared' build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/windows/g08-hosted-options.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/prepare-hosted-windows-media.ps1
      - name: Run hosted public capture diagnostic
        if: ${{ inputs.hosted_g08 && !inputs.hosted_png_ab }}
        shell: pwsh
        run: ./scripts/run-hosted-windows-g08.ps1
      - name: Run serial PNG speed comparison
        if: ${{ inputs.hosted_g08 && inputs.hosted_png_ab }}
        shell: pwsh
        run: node tests/windows/run-hosted-png-speed-pair.mjs
      - uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.hosted_g08 }}
        with:
          name: kelpie-windows-hosted-public-g08
          path: |
            ${{ runner.temp }}/kelpie-hosted-g08-preflight
            ${{ runner.temp }}/kelpie-hosted-g08-evidence
            ${{ runner.temp }}/kelpie-hosted-png-ab
          if-no-files-found: warn
      - name: Package release candidate
        if: ${{ !inputs.hosted_g08 }}
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.hosted_g08 }}
        with:
          name: kelpie-windows-x64
          path: |
            dist/release/windows/*.zip
            dist/release/windows/*.sha256
            dist/release/windows/*.provenance.txt
          if-no-files-found: error
