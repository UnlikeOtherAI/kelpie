name: macOS

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runtime_acceptance:
        description: Run isolated native WK and CEF acceptance after compilation
        type: boolean
        default: false
      runtime_scope:
        description: Hosted runtime scope (full acceptance or focused CEF timing and marker checks)
        type: choice
        options:
          - full
          - cef-timing
          - cef-pump-compare
          - cef-stream
        default: full

permissions:
  contents: read

jobs:
  changes:
    name: Detect macOS build inputs
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - name: Check dependency scope
        id: scope
        run: python3 scripts/ci/macos_inputs.py >> "$GITHUB_OUTPUT"
      - name: Check hosted driver syntax
        run: |
          for file in tests/macos/runtime-*.mjs scripts/testing/macos-workflow-acceptance.mjs; do node --check "$file"; done
          bash -n scripts/testing/macos-sign-test-app.sh
          node --test tests/macos/runtime-harness.test.mjs

      - name: Verify scope gate
        run: python3 -m unittest discover -s tests/ci -p 'test_macos_inputs.py'

  build:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: Build macOS (app + XCTest)
    # The existing CEF bootstrap targets Apple Silicon; this stable image includes Xcode 26.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPREVEAL_REVISION: 3a28e56e5e72aa2a1f0b241cac63140e5906c8b4
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - uses: ./.github/actions/browser-contract

      - name: Install mise (tuist)
        uses: jdx/mise-action@v4.1.0

      - name: Verify hosted Apple toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk_version"
          test "${sdk_version%%.*}" -ge 26
          cmake --version
          ninja --version

      - name: Vendor pinned AppReveal
        run: |
          set -euo pipefail
          git init vendor/AppReveal
          git -C vendor/AppReveal remote add origin https://github.com/UnlikeOtherAI/AppReveal.git
          git -C vendor/AppReveal fetch --depth 1 origin "$APPREVEAL_REVISION"
          git -C vendor/AppReveal checkout --detach FETCH_HEAD
          test "$(git -C vendor/AppReveal rev-parse HEAD)" = "$APPREVEAL_REVISION"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift
        run: make lint-swift

      - name: Bootstrap pinned CEF
        run: bash scripts/download-cef.sh macos

      - name: Build pinned native core and inference libraries
        run: |
          set -euo pipefail
          cmake -S native -B native/.build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKELPIE_BUILD_DESKTOP_ENGINES=OFF \
            -DKELPIE_LOCAL_LLM=ON \
            -DKELPIE_AI_USE_HTTPLIB=OFF \
            -DBUILD_TESTING=ON
          cmake --build native/.build --parallel 1 --target \
            kelpie_core_state kelpie_core_connect kelpie_core_protocol \
            kelpie_core_automation kelpie_core_mcp kelpie_core_ai

      - name: Record native dependency inputs
        run: |
          set -euo pipefail
          grep '^GGML_METAL:BOOL=ON$' native/.build/CMakeCache.txt
          grep '^GGML_BLAS:BOOL=ON$' native/.build/CMakeCache.txt
          grep '^#define CEF_VERSION ' apps/macos/Frameworks/cef_include/cef_version.h
          shasum -a 256 native/.build/core-*/libkelpie_core_*.a \
            "apps/macos/Frameworks/Chromium Embedded Framework.framework/Chromium Embedded Framework"

      - name: Generate Xcode project (tuist)
        working-directory: apps/macos
        run: mise exec -- tuist generate --no-open

      - name: Compile app and XCTest without launching
        # This is a compile check, not signing, release, app launch or native-flow acceptance.
        run: |
          set -euo pipefail
          mkdir -p .cache/macos-ci
          run_xcodebuild() {
            if [[ "${{ inputs.runtime_scope }}" == "cef-pump-compare" ]]; then
              xcodebuild 'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) KELPIE_HOSTED_PUMP_TEST=1' "$@"
            elif [[ "${{ inputs.runtime_scope }}" == "cef-stream" ]]; then
              xcodebuild 'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) DEBUG=1 KELPIE_HOSTED_STREAM_TEST=1' \
                'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) DEBUG KELPIE_HOSTED_STREAM_TEST' \
                'OTHER_SWIFT_FLAGS=$(inherited) -Xcc -DDEBUG=1 -Xcc -DKELPIE_HOSTED_STREAM_TEST=1' "$@"
            else
              xcodebuild "$@"
            fi
          }
          run_xcodebuild \
            -workspace apps/macos/Kelpie.xcworkspace \
            -scheme Kelpie \
            -configuration Debug \
            -derivedDataPath apps/macos/.build \
            -jobs 1 \
            build-for-testing CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .cache/macos-ci/build.log

      - name: Test hosted CEF pump scheduler
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_acceptance && inputs.runtime_scope == 'cef-pump-compare'
        timeout-minutes: 2
        run: |
          xcrun clang++ -std=c++17 -fobjc-arc -fblocks -framework Foundation \
            tests/macos/cef-pump-scheduler.test.mm -o .cache/macos-ci/cef-pump-scheduler-test
          .cache/macos-ci/cef-pump-scheduler-test

      - name: Test hosted CEF stream controls
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_acceptance && inputs.runtime_scope == 'cef-stream'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror tests/macos/cef-stream-fence.test.cpp -o .cache/macos-ci/cef-stream-fence
          .cache/macos-ci/cef-stream-fence
          xcrun clang++ -std=c++17 -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -DDEBUG=1 -DKELPIE_HOSTED_STREAM_TEST=1 -DKELPIE_HOSTED_STREAM_MOCK=1 -I tests/macos \
            -framework AppKit -framework Foundation -framework ImageIO -framework CoreGraphics \
            tests/macos/cef-stream-probe.test.mm apps/macos/Kelpie/Renderer/CEFHostedStreamProbe.mm \
            apps/macos/Kelpie/Renderer/CEFHostedStreamPixels.mm -o .cache/macos-ci/cef-stream-probe
          .cache/macos-ci/cef-stream-probe
          xcrun clang++ -std=c++17 -fobjc-arc -fblocks -Wall -Wextra -Werror \
            -DDEBUG=1 -DKELPIE_HOSTED_STREAM_TEST=1 \
            -framework AppKit -framework Foundation -framework ImageIO -framework CoreGraphics \
            tests/macos/cef-stream-nonce.test.mm apps/macos/Kelpie/Renderer/CEFHostedStreamNonce.mm -o .cache/macos-ci/cef-stream-nonce
          .cache/macos-ci/cef-stream-nonce

      - name: Run hosted workflow admission XCTest
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_acceptance
        timeout-minutes: 8
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace apps/macos/Kelpie.xcworkspace \
            -scheme Kelpie \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath apps/macos/.build \
            -only-testing:KelpieTests/ScriptWorkflowAdmissionTests \
            -skip-testing:KelpieTests/ScriptWorkflowAdmissionTests/testBonjourTXTReplacementKeepsSameHTTPListenerReachable \
            -resultBundlePath .cache/macos-ci/workflow-admission.xcresult \
            test-without-building CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .cache/macos-ci/workflow-admission.log

      - name: Run hosted listener TXT control
        id: txt_control
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_acceptance
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace apps/macos/Kelpie.xcworkspace \
            -scheme Kelpie \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath apps/macos/.build \
            -only-testing:KelpieTests/ScriptWorkflowAdmissionTests/testBonjourTXTReplacementKeepsSameHTTPListenerReachable \
            -resultBundlePath .cache/macos-ci/listener-txt-control.xcresult \
            test-without-building CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .cache/macos-ci/listener-txt-control.log

      - name: Prepare explicitly requested hosted runtime
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_acceptance
        run: |
          set -euo pipefail
          node scripts/testing/macos-workflow-acceptance.mjs --preparation started 0
          trap 'prepare_exit=$?; node scripts/testing/macos-workflow-acceptance.mjs --preparation failed "$prepare_exit"; exit "$prepare_exit"' ERR
          run_xcodebuild() {
            if [[ "${{ inputs.runtime_scope }}" == "cef-pump-compare" ]]; then
              xcodebuild 'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) KELPIE_HOSTED_PUMP_TEST=1' "$@"
            elif [[ "${{ inputs.runtime_scope }}" == "cef-stream" ]]; then
              xcodebuild 'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) DEBUG=1 KELPIE_HOSTED_STREAM_TEST=1' \
                'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) DEBUG KELPIE_HOSTED_STREAM_TEST' \
                'OTHER_SWIFT_FLAGS=$(inherited) -Xcc -DDEBUG=1 -Xcc -DKELPIE_HOSTED_STREAM_TEST=1' "$@"
            else
              xcodebuild "$@"
            fi
          }
          run_xcodebuild \
            -workspace apps/macos/Kelpie.xcworkspace \
            -scheme Kelpie \
            -configuration Debug \
            -derivedDataPath apps/macos/.build-runtime \
            -jobs 1 \
            build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .cache/macos-ci/runtime-build.log
          brew install ffmpeg
          pnpm --filter @unlikeotherai/kelpie build
          bash scripts/testing/macos-sign-test-app.sh
          node scripts/testing/macos-workflow-acceptance.mjs --preparation ready 0

      - name: Exercise owned native app without global input
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_acceptance
        timeout-minutes: 15
        env:
          KELPIE_HOSTED_RUNTIME: '1'
          KELPIE_RUNTIME_SCOPE: ${{ inputs.runtime_scope || 'full' }}
        run: |
          if [[ "$KELPIE_RUNTIME_SCOPE" == "cef-pump-compare" ]]; then
            node scripts/testing/macos-pump-comparison.mjs
          else
            node scripts/testing/macos-workflow-acceptance.mjs
          fi

      - name: Enforce listener TXT control
        if: always() && steps.txt_control.outcome == 'failure'
        run: exit 1

      - name: Retain sanitized native runtime evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.runtime_acceptance
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-native-runtime-evidence
          path: .cache/macos-runtime/evidence
          if-no-files-found: error
          retention-days: 7

      - name: Retain compile diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-build-diagnostics
          path: |
            .cache/macos-ci/build.log
            .cache/macos-ci/runtime-build.log
            .cache/macos-ci/workflow-admission.log
            .cache/macos-ci/workflow-admission.xcresult
            .cache/macos-ci/listener-txt-control.log
            .cache/macos-ci/listener-txt-control.xcresult
          if-no-files-found: ignore
          retention-days: 7
