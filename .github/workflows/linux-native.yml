name: Linux native candidates

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      gtk_diagnostic:
        type: boolean
        default: false
      force_build:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''
      artifact_prefix:
        type: string
        default: linux-native-check

permissions:
  contents: read

jobs:
  changes:
    name: Detect Linux build inputs
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Linux change detection
        run: node --test tests/linux/workflow-scope.test.mjs
      - id: scope
        shell: bash
        env:
          GTK_DIAGNOSTIC: ${{ inputs.gtk_diagnostic }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FORCE: ${{ inputs.force_build || github.event_name == 'workflow_dispatch' }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${GTK_DIAGNOSTIC}" = true ]; then
            test "${EVENT_NAME}" = workflow_dispatch
            test -z "${RELEASE_TAG}"
            test "${FORCE}" = true
          fi
          if [ "${FORCE}" = true ]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bash scripts/ci/linux-native-scope.sh "${BASE}" "${HEAD}" >> "${GITHUB_OUTPUT}"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 45
    name: Build Linux (${{ matrix.distro.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        distro:
          - name: ubuntu-22.04
            image: ubuntu:22.04
            install: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                apt-utils \
                build-essential \
                ca-certificates \
                cmake \
                curl \
                dpkg-dev \
                file \
                ffmpeg \
                git \
                g++-12 \
                libasound2-dev \
                libatk-bridge2.0-dev \
                libatk1.0-dev \
                libavahi-client-dev \
                libcups2-dev \
                libdbus-1-dev \
                libcurl4-openssl-dev \
                libssl-dev \
                libdrm-dev \
                libfontconfig1-dev \
                libgbm-dev \
                libglib2.0-dev \
                libgtk-3-dev \
                libnspr4-dev \
                libnss3-dev \
                libpango1.0-dev \
                libx11-dev \
                libxcomposite-dev \
                libxdamage-dev \
                libxext-dev \
                libxfixes-dev \
                libxrandr-dev \
                ninja-build \
                nlohmann-json3-dev \
                pkg-config \
                tar \
                xz-utils
              bash scripts/install-linux-capture-deps.sh ubuntu
              rm -rf /var/lib/apt/lists/*
              export CC=gcc-12 CXX=g++-12
            package_kind: deb
            build_appimage: true
          - name: fedora-44
            image: fedora:44
            install: |
              dnf install -y \
                make \
                gcc \
                binutils \
                xz \
                ca-certificates \
                cmake \
                curl \
                file \
                ffmpeg-free \
                fontconfig-devel \
                gcc-c++ \
                git \
                glib2-devel \
                gtk3-devel \
                libX11-devel \
                libXcomposite-devel \
                libXdamage-devel \
                libXext-devel \
                libXfixes-devel \
                libXrandr-devel \
                libdrm-devel \
                mesa-libgbm-devel \
                nlohmann-json-devel \
                nspr-devel \
                nss-devel \
                pango-devel \
                pkgconf-pkg-config \
                avahi-devel \
                cups-devel \
                libcurl-devel \
                openssl-devel \
                dbus-devel \
                ninja-build \
                rpm-build \
                tar
              bash scripts/install-linux-capture-deps.sh fedora
              dnf clean all
            package_kind: rpm
            build_appimage: false
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Build Fedora GTK startup diagnostic
        if: ${{ inputs.gtk_diagnostic && matrix.distro.name == 'fedora-44' }}
        env:
          DISTRO_INSTALL: ${{ matrix.distro.install }}
        run: |
          set -euo pipefail
          image='fedora@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e'
          docker pull "${image}"
          docker run --rm --cpus=2 --memory=6g --pids-limit=512 --security-opt no-new-privileges=true \
            -e DISTRO_NAME=fedora-44 -e DISTRO_INSTALL -e DIAGNOSTIC_SOURCE="${GITHUB_SHA}" -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            -e NODE_OPTIONS=--max-old-space-size=2048 -v "${PWD}:/workspace" -w /workspace "${image}" \
            bash scripts/ci/linux-gtk-diagnostic-build.sh

      - name: Upload Fedora GTK diagnostic
        if: ${{ inputs.gtk_diagnostic && matrix.distro.name == 'fedora-44' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-gtk-startup-diagnostic-fedora-44
          path: |
            dist/gtk-diagnostic/kelpie-linux
            dist/gtk-diagnostic/manifest.json
            dist/gtk-diagnostic/build-options.txt
            dist/gtk-diagnostic/runtime-sha256.txt
            dist/gtk-diagnostic/elf-dependencies.txt
            dist/gtk-diagnostic/lock-sha256.txt
            dist/gtk-diagnostic/cef-identity.txt
            dist/gtk-diagnostic/checksums.txt
          if-no-files-found: error

      - name: Build Linux packages
        if: ${{ !inputs.gtk_diagnostic }}
        env:
          DISTRO_NAME: ${{ matrix.distro.name }}
          DISTRO_IMAGE: ${{ matrix.distro.image }}
          DISTRO_INSTALL: ${{ matrix.distro.install }}
          PACKAGE_KIND: ${{ matrix.distro.package_kind }}
          BUILD_APPIMAGE: ${{ matrix.distro.build_appimage }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPIMAGETOOL_URL: https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*KELPIE_LINUX_VERSION="\([^"]*\)".*/\1/p' apps/linux/CMakeLists.txt)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ -z "${RELEASE_TAG}" ]; then
            version="${version}~candidate.${GITHUB_SHA:0:12}"
            release_label="candidate-${GITHUB_SHA:0:12}"
          else
            release_label="$(printf '%s' "${RELEASE_TAG}" | sed -E 's#[^0-9A-Za-z._-]+#-#g')"
          fi
          package_root="dist/release/${DISTRO_NAME}"
          mkdir -p "${package_root}"

          docker pull "${DISTRO_IMAGE}"

          docker run --rm --cpus=2 --memory=6g --pids-limit=512 \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            -e NODE_OPTIONS=--max-old-space-size=2048 \
            -e DISTRO_NAME="${DISTRO_NAME}" \
            -e DISTRO_INSTALL="${DISTRO_INSTALL}" \
            -e PACKAGE_KIND="${PACKAGE_KIND}" \
            -e BUILD_APPIMAGE="${BUILD_APPIMAGE}" \
            -e VERSION="${version}" \
            -e RELEASE_LABEL="${release_label}" \
            -e APPIMAGETOOL_URL="${APPIMAGETOOL_URL}" \
            -v "${PWD}:/workspace" \
            -w /workspace \
            "${DISTRO_IMAGE}" \
            bash -lc '
              set -euo pipefail
              eval "${DISTRO_INSTALL}"
              curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz -o /tmp/kelpie-node.tar.xz
              tar -xJf /tmp/kelpie-node.tar.xz -C /opt
              export PATH="/opt/node-v22.14.0-linux-x64/bin:${PATH}"
              npm install --global pnpm@10.12.4

              package_root="dist/release/${DISTRO_NAME}"
              bundle_root="${package_root}/bundle"
              mkdir -p "${package_root}"
              git -c safe.directory=/workspace rev-parse HEAD > "${package_root}/source-revision.txt"
              sha256sum pnpm-lock.yaml > "${package_root}/lock-sha256.txt"
              bash scripts/download-cef.sh linux
              bash scripts/check-linux-script-codecs.sh > "${package_root}/factory-provenance.txt"
              make linux
              {
                for cache in native/.build-linux/CMakeCache.txt apps/linux/build/CMakeCache.txt; do
                  test -f "$cache"
                  printf "%s\n" "--- $cache ---"
                  awk "/^(CEF_ROOT|KELPIE_LOCAL_LLM|KELPIE_LINUX_HEADLESS_ONLY|KELPIE_LINUX_G08_TEST_OBSERVATION|KELPIE_LINUX_ADMISSION_TEST_OBSERVATION):/ { print }" "$cache"
                done
              } > "${package_root}/build-options.txt"
              pnpm --filter @unlikeotherai/kelpie build
              (cd packages/cli && npm pack --ignore-scripts --pack-destination "/workspace/${package_root}")
              ctest --test-dir apps/linux/build --verbose --output-log "${package_root}/native-checks.log" -R "^(linux_script_(media|artifact)_test|linux_irregular_mp4_test)$"
              sha256sum apps/linux/build/kelpie-linux apps/linux/build/libcef.so > "${package_root}/binary-sha256.txt"

              bash scripts/build-linux-runtime-bundle.sh \
                --version "${VERSION}" \
                --build-label "${DISTRO_NAME}" \
                --output-dir "${bundle_root}"

              tar -C "${bundle_root}" -czf "${package_root}/kelpie-linux-${RELEASE_LABEL}-${DISTRO_NAME}-x86_64.tar.gz" kelpie-linux

              case "${PACKAGE_KIND}" in
                deb)
                  bash scripts/package-linux-deb.sh \
                    --version "${VERSION}" \
                    --bundle-dir "${bundle_root}/kelpie-linux" \
                    --output-dir "${package_root}"

                  if [ "${BUILD_APPIMAGE}" = "true" ]; then
                    curl -L --fail -o /tmp/appimagetool.AppImage "${APPIMAGETOOL_URL}"
                    chmod 755 /tmp/appimagetool.AppImage
                    rm -rf /tmp/squashfs-root
                    (
                      cd /tmp
                      APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool.AppImage --appimage-extract >/dev/null
                    )
                    test -x /tmp/squashfs-root/AppRun
                    bash scripts/package-linux-appimage.sh \
                      --version "${VERSION}" \
                      --bundle-dir "${bundle_root}/kelpie-linux" \
                      --output-dir "${package_root}" \
                      --appimagetool "/tmp/squashfs-root/AppRun"
                  fi
                  ;;
                rpm)
                  bash scripts/package-linux-rpm.sh \
                    --version "${VERSION}" \
                    --bundle-dir "${bundle_root}/kelpie-linux" \
                    --output-dir "${package_root}"
                  ;;
              esac

              (
                cd "${package_root}"
                shopt -s nullglob
                files=(*.tar.gz *.deb *.rpm *.AppImage)
                test "${#files[@]}" -gt 0
                sha256sum "${files[@]}" | tee checksums.txt
              )
              chmod -R a+rX dist/release
            ' 2>&1 | tee "${package_root}/candidate-build.log"

      - name: Verify installed Linux candidate
        if: ${{ !inputs.gtk_diagnostic }}
        id: installed_candidate
        timeout-minutes: 15
        env:
          DISTRO_NAME: ${{ matrix.distro.name }}
          DISTRO_IMAGE: ${{ matrix.distro.image }}
        run: |
          set -euo pipefail
          package_root="dist/release/${DISTRO_NAME}"
          curl -fsSL https://raw.githubusercontent.com/moby/profiles/4b8214fc4971e06172938a1f1554ccff6647ee80/seccomp/default.json -o "${RUNNER_TEMP}/kelpie-moby-default.json"
          KELPIE_SECCOMP_BASELINE="${RUNNER_TEMP}/kelpie-moby-default.json" node --test tests/linux/seccomp-profile.test.mjs
          node scripts/ci/linux-test-seccomp.mjs "${RUNNER_TEMP}/kelpie-moby-default.json" "${RUNNER_TEMP}/kelpie-test-seccomp.json"
          sha256sum "${RUNNER_TEMP}/kelpie-moby-default.json" "${RUNNER_TEMP}/kelpie-test-seccomp.json" > "${package_root}/test-seccomp-sha256.txt"
          docker version > "${package_root}/test-docker-version.txt"
          docker run --rm --cpus=2 --memory=6g --pids-limit=512 --shm-size=256m \
            --security-opt no-new-privileges=true \
            -e KELPIE_VERIFY_TERMINAL_IDR=1 \
            --security-opt "seccomp=${RUNNER_TEMP}/kelpie-test-seccomp.json" \
            -v "${PWD}:/workspace:ro" \
            -v "${PWD}/${package_root}:/workspace/${package_root}" \
            -w /workspace "${DISTRO_IMAGE}" \
            bash scripts/ci/linux-installed-smoke.sh "${DISTRO_NAME}" "/workspace/${package_root}" \
            2>&1 | tee "${package_root}/candidate-installed-smoke.log"

      - name: Diagnose failed installed candidate namespaces
        if: failure() && steps.installed_candidate.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        env:
          DISTRO_NAME: ${{ matrix.distro.name }}
          DISTRO_IMAGE: ${{ matrix.distro.image }}
        run: |
          set -euo pipefail
          package_root="dist/release/${DISTRO_NAME}"
          test -s "${RUNNER_TEMP}/kelpie-test-seccomp.json"
          docker run --rm --cpus=2 --memory=6g --pids-limit=512 --shm-size=256m \
            --security-opt no-new-privileges=true \
            --security-opt "seccomp=${RUNNER_TEMP}/kelpie-test-seccomp.json" \
            -v "${PWD}:/workspace:ro" -v "${PWD}/${package_root}:/workspace/${package_root}" \
            -w /workspace "${DISTRO_IMAGE}" \
            bash scripts/ci/linux-namespace-diagnostic.sh "${DISTRO_NAME}" "/workspace/${package_root}" \
            2>&1 | tee "${package_root}/candidate-namespace-diagnostic.log"

      - name: Replay failed installed candidate without tracing
        if: failure() && steps.installed_candidate.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 15
        env:
          DISTRO_NAME: ${{ matrix.distro.name }}
          DISTRO_IMAGE: ${{ matrix.distro.image }}
        run: |
          set -euo pipefail
          package_root="dist/release/${DISTRO_NAME}"
          test -s "${RUNNER_TEMP}/kelpie-test-seccomp.json"
          docker run --rm --cpus=2 --memory=6g --pids-limit=512 --shm-size=256m \
            --security-opt no-new-privileges=true \
            --security-opt "seccomp=${RUNNER_TEMP}/kelpie-test-seccomp.json" \
            -e KELPIE_INSTALLED_SMOKE_REPLAY=1 -e KELPIE_VERIFY_TERMINAL_IDR=1 -v "${PWD}:/workspace:ro" -v "${PWD}/${package_root}:/workspace/${package_root}" \
            -w /workspace "${DISTRO_IMAGE}" \
            bash scripts/ci/linux-installed-smoke.sh "${DISTRO_NAME}" "/workspace/${package_root}" \
            2>&1 | tee "${package_root}/candidate-installed-replay.log"

      - name: Upload installed-candidate diagnostics
        uses: actions/upload-artifact@v7.0.1
        if: ${{ always() && !inputs.gtk_diagnostic }}
        with:
          name: ${{ inputs.artifact_prefix || 'linux-native-check' }}-${{ matrix.distro.name }}-diagnostics
          path: |
            dist/release/${{ matrix.distro.name }}/namespace-diagnostic/
            dist/release/${{ matrix.distro.name }}/installed-smoke/outcome.json
            dist/release/${{ matrix.distro.name }}/installed-smoke/capture/count-mismatch.gif
            dist/release/${{ matrix.distro.name }}/installed-smoke/capture/count-mismatch.mp4
            dist/release/${{ matrix.distro.name }}/installed-smoke/capture/*.json
            dist/release/${{ matrix.distro.name }}/installed-smoke/capture/capture/report.json
            dist/release/${{ matrix.distro.name }}/installed-smoke/alias/report.json
            dist/release/${{ matrix.distro.name }}/installed-smoke/*.log
            dist/release/${{ matrix.distro.name }}/installed-smoke/*.txt
            dist/release/${{ matrix.distro.name }}/installed-smoke-replay/outcome.json
            dist/release/${{ matrix.distro.name }}/installed-smoke-replay/capture/count-mismatch.gif
            dist/release/${{ matrix.distro.name }}/installed-smoke-replay/capture/count-mismatch.mp4
            dist/release/${{ matrix.distro.name }}/installed-smoke-replay/capture/*.json
            dist/release/${{ matrix.distro.name }}/installed-smoke-replay/capture/capture/report.json
            dist/release/${{ matrix.distro.name }}/installed-smoke-replay/alias/report.json
            dist/release/${{ matrix.distro.name }}/installed-smoke-replay/*.log
            dist/release/${{ matrix.distro.name }}/installed-smoke-replay/*.txt
            dist/release/${{ matrix.distro.name }}/candidate-installed-*.log
            dist/release/${{ matrix.distro.name }}/candidate-namespace-diagnostic.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() && !inputs.gtk_diagnostic }}
        with:
          name: ${{ inputs.artifact_prefix || 'linux-native-check' }}-${{ matrix.distro.name }}
          path: |
            dist/release/${{ matrix.distro.name }}/*.tar.gz
            dist/release/${{ matrix.distro.name }}/*.tgz
            dist/release/${{ matrix.distro.name }}/*.deb
            dist/release/${{ matrix.distro.name }}/*.rpm
            dist/release/${{ matrix.distro.name }}/*.AppImage
            dist/release/${{ matrix.distro.name }}/checksums.txt
            dist/release/${{ matrix.distro.name }}/source-revision.txt
            dist/release/${{ matrix.distro.name }}/binary-sha256.txt
            dist/release/${{ matrix.distro.name }}/lock-sha256.txt
            dist/release/${{ matrix.distro.name }}/build-options.txt
            dist/release/${{ matrix.distro.name }}/factory-provenance.txt
            dist/release/${{ matrix.distro.name }}/native-checks.log
            dist/release/${{ matrix.distro.name }}/test-seccomp-sha256.txt
            dist/release/${{ matrix.distro.name }}/test-docker-version.txt
          if-no-files-found: warn


  result:
    name: Linux native check
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    env:
      DETECTION: ${{ needs.changes.result }}
      REQUIRED: ${{ needs.changes.outputs.build }}
      BUILD: ${{ needs.build.result }}
      GTK_DIAGNOSTIC: ${{ inputs.gtk_diagnostic }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          test "${DETECTION}" = success
          if [ "${REQUIRED}" != true ]; then
            echo "Skipped: no Linux app or native build input changed."
          else
            test "${BUILD}" = success
            if [ "${GTK_DIAGNOSTIC}" = true ]; then
              echo "Fedora GTK diagnostic build only; no package or installed verification."
            fi
          fi
