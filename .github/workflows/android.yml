name: Android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'core/native/**'
      - 'core/android/**'
      - '.editorconfig'
      - 'packages/shared/**'
      - 'scripts/native/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/actions/browser-contract/**'
  push:
    branches:
      - main
    paths:
      - 'apps/android/**'
      - 'core/native/**'
      - 'core/android/**'
      - '.editorconfig'
      - 'packages/shared/**'
      - 'scripts/native/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/actions/browser-contract/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + lint Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/browser-contract

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.3

      - name: Cache Gradle
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('core/android/**/*.gradle*', 'apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Lint, ktlint, build
        working-directory: apps/android
        run: ./gradlew --no-daemon lint ktlintCheck build

      - name: Verify 16 KiB ELF and APK ZIP alignment
        run: python3 scripts/testing/check_android_16kb_apk.py apps/android/app/build/outputs/apk/debug/app-debug.apk
