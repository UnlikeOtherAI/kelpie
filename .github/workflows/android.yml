name: Android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'native/**'
      - 'packages/shared/**'
      - 'scripts/native/**'
      - 'scripts/testing/android-native-*'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/actions/browser-contract/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'native/**'
      - 'packages/shared/**'
      - 'scripts/native/**'
      - 'scripts/testing/android-native-*'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/actions/browser-contract/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      native_test:
        description: Run sequential API35 phone/tablet native acceptance on hosted KVM
        type: boolean
        default: false
      targeted_mobile:
        description: Run only the scoped Android navigation and input controls
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build + lint Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/browser-contract
      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.3
      - name: Cache Gradle
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Lint, ktlint, build
        working-directory: apps/android
        run: ./gradlew --no-daemon lint ktlintCheck build

  native-test:
    name: Native phone + tablet acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.native_test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      GRADLE_OPTS: -Dorg.gradle.workers.max=1
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/browser-contract
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.3
      - name: Check native runner ownership and report guards
        run: node --test scripts/testing/android-native-ownership.test.mjs scripts/testing/android-native-report.test.mjs
      - name: Verify hosted KVM
        shell: bash
        run: |
          mkdir -p native-evidence
          if [[ ! -c /dev/kvm ]]; then
            echo KVM_UNAVAILABLE | tee native-evidence/blocker.txt
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install media verification tools
        if: ${{ !inputs.targeted_mobile }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Build matching CLI
        run: pnpm install --frozen-lockfile && pnpm --workspace-concurrency=1 -r build
      - name: Build shipping JNI app and test APK sequentially
        working-directory: apps/android
        run: >-
          ./gradlew --no-daemon --max-workers=1
          '-Dorg.gradle.jvmargs=-Xmx2g -XX:ActiveProcessorCount=2'
          -Dorg.gradle.parallel=false
          -Pkotlin.compiler.execution.strategy=in-process
          -Pandroid.injected.build.abi=x86_64
          ktlintCheck testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Execute phone then tablet public native corpus
        shell: bash
        run: |
          bash scripts/testing/android-native-capture.sh "$PWD/native-evidence" \
            apps/android/app/build/intermediates/apk/debug/app-debug.apk \
            apps/android/app/build/intermediates/apk/androidTest/debug/app-debug-androidTest.apk "${{ inputs.targeted_mobile && 'targeted' || 'full' }}"
      - name: Retain curated evidence for seven days
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-native-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            native-evidence/*.txt
            native-evidence/*.log
            native-evidence/report.json
            native-evidence/phone/*.json
            native-evidence/phone/*.txt
            native-evidence/phone/*.log
            native-evidence/phone/avd-config.ini
            native-evidence/phone/targeted/navigation-stop/case.txt
            native-evidence/phone/targeted/navigation-stop/exit.txt
            native-evidence/phone/targeted/navigation-stop/instrumentation.log
            native-evidence/phone/targeted/chrome-input/case.txt
            native-evidence/phone/targeted/chrome-input/exit.txt
            native-evidence/phone/targeted/chrome-input/instrumentation.log
            native-evidence/phone/targeted/renderer-system-key/case.txt
            native-evidence/phone/targeted/renderer-system-key/exit.txt
            native-evidence/phone/targeted/renderer-system-key/instrumentation.log
            native-evidence/phone/targeted/navigation-stop/script-acceptance/navigation-stop-result.json
            native-evidence/phone/targeted/chrome-input/script-acceptance/native-chrome-input-result.json
            native-evidence/phone/script-acceptance/**
            native-evidence/phone/script-codec-acceptance/**
            native-evidence/tablet/*.json
            native-evidence/tablet/*.txt
            native-evidence/tablet/*.log
            native-evidence/tablet/avd-config.ini
            native-evidence/tablet/targeted/navigation-stop/case.txt
            native-evidence/tablet/targeted/navigation-stop/exit.txt
            native-evidence/tablet/targeted/navigation-stop/instrumentation.log
            native-evidence/tablet/targeted/chrome-input/case.txt
            native-evidence/tablet/targeted/chrome-input/exit.txt
            native-evidence/tablet/targeted/chrome-input/instrumentation.log
            native-evidence/tablet/targeted/renderer-system-key/case.txt
            native-evidence/tablet/targeted/renderer-system-key/exit.txt
            native-evidence/tablet/targeted/renderer-system-key/instrumentation.log
            native-evidence/tablet/targeted/navigation-stop/script-acceptance/navigation-stop-result.json
            native-evidence/tablet/targeted/chrome-input/script-acceptance/native-chrome-input-result.json
            native-evidence/tablet/script-acceptance/**
            native-evidence/tablet/script-codec-acceptance/**
            apps/android/app/build/reports/tests/**
            apps/android/app/build/test-results/**