name: Opt-in same-host worker comparison

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Allowlisted hosted runner for smoke or reviewed comparison
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-22.04
        default: ubuntu-24.04
      sandbox_only:
        type: boolean
        default: false
      isolation_only:
        type: boolean
        default: false
      eof_only:
        type: boolean
        default: false
      diagnostic_only:
        type: boolean
        default: false
      public_history:
        type: boolean
        default: false
      bfcache_off:
        type: boolean
        default: false
      prepare_only:
        description: Record official Chromium identity without starting benchmark units
        type: boolean
        default: true
      chromium_archive_sha256:
        description: Previously reviewed Chromium archive SHA-256 (required for measurement)
        type: string
        default: ""
      chromium_binary_sha256:
        description: Previously reviewed extracted executable SHA-256 (required for measurement)
        type: string
        default: ""
  workflow_call:
    inputs:
      runner_label:
        type: string
        default: ubuntu-24.04
      sandbox_only:
        type: boolean
        default: false
      isolation_only:
        type: boolean
        default: false
      eof_only:
        type: boolean
        default: false
      diagnostic_only:
        type: boolean
        default: false
      public_history:
        type: boolean
        default: false
      bfcache_off:
        type: boolean
        default: false
      prepare_only:
        type: boolean
        default: true
      chromium_archive_sha256:
        type: string
        default: ""
      chromium_binary_sha256:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: worker-comparison-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    name: Restricted same-host reader comparison
    runs-on: ${{ inputs.runner_label == 'ubuntu-22.04' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    env:
      PREPARE_ONLY: ${{ inputs.prepare_only }}
      REQUESTED_RUNNER: ${{ inputs.runner_label }}
      SANDBOX_ONLY: ${{ inputs.sandbox_only }}
      ISOLATION_ONLY: ${{ inputs.isolation_only }}
      EOF_ONLY: ${{ inputs.eof_only }}
      DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
      PUBLIC_HISTORY: ${{ inputs.public_history }}
      BFCACHE_OFF: ${{ inputs.bfcache_off }}
      CHROMIUM_ARCHIVE_SHA256: ${{ inputs.chromium_archive_sha256 }}
      CHROMIUM_BINARY_SHA256: ${{ inputs.chromium_binary_sha256 }}
    steps:
      - name: Validate hosted runner choice
        shell: bash
        run: |
          [[ "$EOF_ONLY" != true || ( "$ISOLATION_ONLY" == false && "$SANDBOX_ONLY" == false && "$PREPARE_ONLY" == true && "$REQUESTED_RUNNER" == ubuntu-22.04 ) ]] || exit 1
          [[ "$DIAGNOSTIC_ONLY" != true || ( "$EOF_ONLY" == false && "$ISOLATION_ONLY" == false && "$SANDBOX_ONLY" == false && "$PREPARE_ONLY" == false && "$REQUESTED_RUNNER" == ubuntu-22.04 ) ]] || exit 1
          [[ "$BFCACHE_OFF" != true || "$DIAGNOSTIC_ONLY" == true ]] || exit 1
          [[ "$PUBLIC_HISTORY" != true || ( "$DIAGNOSTIC_ONLY" == true && "$BFCACHE_OFF" == false ) ]] || exit 1
          case "$REQUESTED_RUNNER" in
            ubuntu-24.04) [[ "$PREPARE_ONLY" == true || "$SANDBOX_ONLY" == true || "$ISOLATION_ONLY" == true ]] || exit 1 ;;
            ubuntu-22.04) [[ "$ISOLATION_ONLY" == false && ( "$SANDBOX_ONLY" == true || "$PREPARE_ONLY" == false || "$EOF_ONLY" == true ) ]] || exit 1 ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
        if: inputs.isolation_only == false && inputs.sandbox_only == false
        with:
          version: 10
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.14.0

      - name: Prepare pinned test inputs outside measured units
        if: inputs.isolation_only == false && inputs.sandbox_only == false && inputs.eof_only == false
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(id -u)" != 0 ]]
          [[ "$PREPARE_ONLY" == true || "$PREPARE_ONLY" == false ]]
          if [[ "$PREPARE_ONLY" == false ]]; then
            [[ "$CHROMIUM_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
            [[ "$CHROMIUM_BINARY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          fi
          pnpm install --frozen-lockfile
          node --test tests/linux/worker-comparison-result.test.mjs tests/linux/worker-comparison-policy.test.mjs tests/linux/worker-comparison-listener.test.mjs tests/linux/worker-comparison-workflow.test.mjs tests/linux/lightpanda-reader-diagnostics.test.mjs tests/linux/worker-comparison-first-failure.test.mjs tests/linux/worker-listener-classifier.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/testing/test_extract_worker_chromium.py
          node -e 'const p=require("./node_modules/.pnpm/playwright-core@1.62.1/node_modules/playwright-core/browsers.json");const c=p.browsers.find(x=>x.name==="chromium");if(c.revision!=="1234"||c.browserVersion!=="151.0.7922.34")process.exit(1)'
          assets="$RUNNER_TEMP/worker-ab-assets"
          setup="$RUNNER_TEMP/worker-ab-setup"
          mkdir -m 700 "$assets" "$setup"
          curl --fail --location --proto '=https' --max-time 240 --max-filesize 100000000 \
            'https://github.com/lightpanda-io/browser/releases/download/1.0.2/lightpanda-x86_64-linux' -o "$assets/lightpanda"
          printf '%s  %s\n' 'ae7d01d261efb9e480e18ce3424533332883863bcf70b12a4321b5733f37e19e' "$assets/lightpanda" | sha256sum --check --status
          chmod 700 "$assets/lightpanda"
          playwright_url='https://cdn.playwright.dev/builds/cft/151.0.7922.34/linux64/chrome-linux64.zip'
          google_url='https://storage.googleapis.com/chrome-for-testing-public/151.0.7922.34/linux64/chrome-linux64.zip'
          curl --fail --location --proto '=https' --max-time 300 --max-filesize 400000000 "$playwright_url" -o "$assets/chrome.zip"
          curl --fail --location --proto '=https' --max-time 300 --max-filesize 400000000 "$google_url" -o "$assets/chrome-google.zip"
          archive_sha="$(sha256sum "$assets/chrome.zip" | cut -d' ' -f1)"
          google_sha="$(sha256sum "$assets/chrome-google.zip" | cut -d' ' -f1)"
          printf '%s\n' "$archive_sha" > "$setup/playwright-archive-sha256.txt"
          printf '%s\n' "$google_sha" > "$setup/google-archive-sha256.txt"
          printf '%s\n' "$playwright_url" > "$setup/playwright-source.txt"
          printf '%s\n' "$google_url" > "$setup/google-source.txt"
          printf '%s\n' 'Playwright registry metadata supplies no publisher SHA-256; cross-endpoint equality is not a publisher signature.' > "$setup/provenance-limits.txt"
          [[ "$archive_sha" == "$google_sha" ]]
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/testing/extract-worker-chromium.py "$assets/chrome.zip" "$assets/chrome"
          binary_sha="$(sha256sum "$assets/chrome/chrome-linux64/chrome" | cut -d' ' -f1)"
          mkdir -m 700 "$assets/version-home"
          version="$(env -i PATH="$PATH" HOME="$assets/version-home" LANG=C.UTF-8 "$assets/chrome/chrome-linux64/chrome" --version)"
          printf '%s\n' "$binary_sha" > "$setup/chromium-binary-sha256.txt"
          printf '%s\n' "$version" > "$setup/chromium-version.txt"
          printf '%s\n' "$GITHUB_SHA" > "$setup/source.txt"
          printf '%s\n' 'ae7d01d261efb9e480e18ce3424533332883863bcf70b12a4321b5733f37e19e' > "$setup/lightpanda-sha256.txt"
          [[ "$version" == *151.0.7922.34* ]]
          if [[ "$PREPARE_ONLY" == false ]]; then
            [[ "$archive_sha" == "$CHROMIUM_ARCHIVE_SHA256" ]]
            [[ "$binary_sha" == "$CHROMIUM_BINARY_SHA256" ]]
          fi
      - name: Build comparison CLI and shared packages
        if: inputs.isolation_only == false && inputs.sandbox_only == false && inputs.eof_only == false && inputs.prepare_only == false
        shell: bash
        run: |
          pnpm --filter @unlikeotherai/kelpie-shared build
          pnpm --filter @unlikeotherai/kelpie build
      - name: Compare in separately bounded loopback-only units
        if: inputs.isolation_only == false && inputs.sandbox_only == false && inputs.eof_only == false && inputs.prepare_only == false
        env:
          KELPIE_AB_DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          KELPIE_AB_PUBLIC_HISTORY: ${{ inputs.public_history }}
          KELPIE_AB_BFCACHE_OFF: ${{ inputs.bfcache_off }}
        shell: bash
        run: bash scripts/testing/run-worker-comparison-hosted.sh
      - name: Prepare pinned Lightpanda and public CLI for EOF proof
        if: inputs.eof_only == true
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(id -u)" != 0 ]]
          pnpm install --frozen-lockfile
          pnpm --filter @unlikeotherai/kelpie-shared build
          pnpm --filter @unlikeotherai/kelpie build
          assets="$RUNNER_TEMP/worker-ab-assets"
          mkdir -m 700 "$assets"
          curl --fail --location --proto '=https' --max-time 240 --max-filesize 100000000 \
            'https://github.com/lightpanda-io/browser/releases/download/1.0.2/lightpanda-x86_64-linux' -o "$assets/lightpanda"
          printf '%s  %s\n' 'ae7d01d261efb9e480e18ce3424533332883863bcf70b12a4321b5733f37e19e' "$assets/lightpanda" | sha256sum --check --status
          chmod 700 "$assets/lightpanda"
      - name: Probe public worker EOF in isolated unit
        if: inputs.eof_only == true
        env:
          KELPIE_AB_EOF_ONLY: "true"
        run: bash scripts/testing/run-worker-comparison-hosted.sh
      - name: Probe isolation without a browser
        if: inputs.isolation_only == true
        env:
          KELPIE_AB_ISOLATION_ONLY: "true"
        run: bash scripts/testing/run-worker-comparison-hosted.sh
      - name: Prepare pinned Chromium for sandbox smoke
        if: inputs.sandbox_only == true && inputs.isolation_only == false
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHROMIUM_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ && "$CHROMIUM_BINARY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          assets="$RUNNER_TEMP/worker-ab-assets"
          mkdir -m 700 "$assets"
          curl --fail --location --proto '=https' --max-time 300 --max-filesize 400000000 \
            'https://cdn.playwright.dev/builds/cft/151.0.7922.34/linux64/chrome-linux64.zip' -o "$assets/chrome.zip"
          printf '%s  %s\n' "$CHROMIUM_ARCHIVE_SHA256" "$assets/chrome.zip" | sha256sum --check --status
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/testing/extract-worker-chromium.py "$assets/chrome.zip" "$assets/chrome"
          printf '%s  %s\n' "$CHROMIUM_BINARY_SHA256" "$assets/chrome/chrome-linux64/chrome" | sha256sum --check --status
      - name: Smoke test pinned Chromium sandbox
        if: inputs.sandbox_only == true && inputs.isolation_only == false
        env:
          KELPIE_AB_SANDBOX_ONLY: "true"
        run: bash scripts/testing/run-worker-comparison-hosted.sh
      - name: Retain scoped evidence and failures
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: worker-comparison-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/worker-ab-setup/
            ${{ runner.temp }}/worker-ab-evidence/
          if-no-files-found: warn
          retention-days: 14
