name: Publish Linux package repositories

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: linux-package-repositories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install package repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c
      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${APT_GPG_PRIVATE_KEY}" ]; then
            exit 0
          fi
          printf '%s' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
      - name: Build package repositories in site/
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: bash scripts/build-linux-package-repos.sh --site-dir site
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@v5.0.0
